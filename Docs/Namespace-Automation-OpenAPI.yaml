openapi: 3.0.3
info:
  title: Namespace Automation API
  version: 1.0.0
  description: API for PowerApps to request namespace creation and quota updates.
servers:
  - url: https://api.example.com
security:
  - oauth2: ["namespace.read", "namespace.write"]
paths:
  /namespaces:
    post:
      summary: Create a namespace
      operationId: createNamespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamespaceCreateRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceRequestStatus"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    get:
      summary: List namespaces
      operationId: listNamespaces
      parameters:
        - in: query
          name: ownerGroupId
          schema:
            type: string
        - in: query
          name: clusterId
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceList"
  /namespaces/{name}:
    get:
      summary: Get namespace detail
      operationId: getNamespace
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Namespace"
  /namespaces/{name}/quotas:
    patch:
      summary: Update quotas for a namespace
      operationId: updateNamespaceQuotas
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamespaceQuotaUpdate"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceRequestStatus"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /requests/{requestId}:
    get:
      summary: Get request status
      operationId: getRequestStatus
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceRequestStatus"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            namespace.read: Read namespaces
            namespace.write: Create/update namespaces
  schemas:
    NamespaceCreateRequest:
      type: object
      required: [name, ownerGroupId, clusterId, quotas]
      properties:
        name:
          type: string
        ownerGroupId:
          type: string
          description: Entra ID group object ID
        clusterId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        quotas:
          $ref: "#/components/schemas/ResourceQuotas"
    NamespaceQuotaUpdate:
      type: object
      required: [quotas]
      properties:
        quotas:
          $ref: "#/components/schemas/ResourceQuotas"
    ResourceQuotas:
      type: object
      required: [cpu, memory, storage]
      properties:
        cpu:
          type: string
          example: "4"
        memory:
          type: string
          example: "8Gi"
        storage:
          type: string
          example: "100Gi"
    Namespace:
      type: object
      properties:
        name:
          type: string
        ownerGroupId:
          type: string
        clusterId:
          type: string
        quotas:
          $ref: "#/components/schemas/ResourceQuotas"
        status:
          type: string
    NamespaceList:
      type: array
      items:
        $ref: "#/components/schemas/Namespace"
    NamespaceRequestStatus:
      type: object
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [accepted, in_progress, succeeded, failed]
        message:
          type: string
